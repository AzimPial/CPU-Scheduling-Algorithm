<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchedViz — CPU Scheduling Algorithm Visualizer</title>
  <meta name="description" content="Interactive CPU Scheduling Algorithm Visualizer for OS courses. Visualize FCFS, SJF, SRTF, Priority, and Round Robin algorithms with animated Gantt charts.">

  <!-- Prevent FOUC: set theme before paint -->
  <script>
    (function(){try{var t=localStorage.getItem('schedviz_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Chart.js (Module 2 comparison) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/chat.css">
  <link rel="stylesheet" href="assets/css/gantt.css">
  <link rel="stylesheet" href="assets/css/landing.css">

  <!-- Favicon (inline SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%230B0F14'/><rect x='12' y='30' width='22' height='40' rx='4' fill='%234FC3F7'/><rect x='40' y='20' width='22' height='50' rx='4' fill='%23FF8A65'/><rect x='68' y='38' width='22' height='32' rx='4' fill='%2381C784'/></svg>">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Session history">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <h2>SchedViz</h2>
        </div>
        <div class="sidebar-actions">
          <button class="btn-icon" id="btn-new-chat" title="New chat (Ctrl+N)" aria-label="New chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>
      <div class="sidebar-list" id="sidebar-list">
        <div class="sidebar-section-label">Recent</div>
        <div class="sidebar-empty">No saved sessions yet.<br>Run an algorithm to create one.</div>
      </div>
    </aside>

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main Area -->
    <main class="main">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn-icon topbar-hamburger" id="btn-hamburger" aria-label="Toggle sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="mode-tabs">
            <button class="mode-tab active" data-mode="visualize">Visualize</button>
            <button class="mode-tab" data-mode="compare">Compare</button>
          </div>
        </div>
        <div class="topbar-right">
          <button class="btn-icon" id="btn-shortcuts" title="Keyboard shortcuts" aria-label="Keyboard shortcuts">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01"/><path d="M10 8h.01"/><path d="M14 8h.01"/><path d="M18 8h.01"/><path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/></svg>
          </button>
          <button class="btn-icon" id="btn-theme" aria-label="Toggle theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
        </div>
      </header>

      <!-- Chat Thread -->
      <div class="chat-thread" id="chat-thread">
        <div class="chat-messages" id="chat-messages"></div>
      </div>

      <!-- Input Bar -->
      <div class="input-bar">
        <div class="input-bar-inner" id="input-bar-inner"></div>
      </div>
    </main>
  </div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
